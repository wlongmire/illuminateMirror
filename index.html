<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Illuminate Philly — Live Transcription Display</title>
<style>
  /* Self-hosted (not fonts.googleapis.com) so the piece has zero network
     dependency once loaded — a show with no internet still gets the
     intended blackletter look. SIL Open Font License, see
     public/fonts/OFL.txt. */
  @font-face {
    font-family: 'UnifrakturCook';
    font-style: normal;
    font-weight: 700;
    font-display: swap;
    src: url('/fonts/UnifrakturCook-Bold.woff2') format('woff2');
  }
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
  }
  body { font-family: system-ui, sans-serif; }
  #gl {
    position: fixed; inset: 0; display: block;
  }

  /* Left/top/width/height are set by main.js to match the frame image's
     own letterboxed box — left as inset:0 here so the frame-off state
     (the default) needs no JS override at all to fill the viewport. */
  #frameOverlay {
    position: fixed; pointer-events: none; z-index: 4;
  }

  #status {
    position: fixed; top: 20px; right: 24px;
    z-index: 5;
  }
  #dot {
    display: inline-block;
    width: 9px; height: 9px; border-radius: 50%;
    background: #444; transition: background 0.2s;
  }
  #dot.live { background: #e33; box-shadow: 0 0 8px #e33; }

  #start {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000; color: #fff;
    z-index: 10;
  }
  #start button {
    font: inherit; font-size: 18px; padding: 14px 28px;
    background: transparent; color: #fff; border: 1px solid #666;
    border-radius: 4px; cursor: pointer; letter-spacing: 0.03em;
  }
  #start button:hover { border-color: #fff; }
  #start button:disabled { opacity: 0.4; cursor: not-allowed; }

  #debug {
    position: fixed; bottom: 8px; left: 8px;
    font-family: ui-monospace, monospace; font-size: 11px; color: #6f6;
    background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 3px;
    z-index: 5; white-space: pre; line-height: 1.5;
  }

  #stylePanel {
    position: fixed; top: 20px; left: 24px;
    display: flex; flex-direction: column; gap: 10px;
    font-size: 12px; color: #ccc;
    background: rgba(0,0,0,0.75); border: 1px solid #333; border-radius: 6px;
    padding: 14px 16px; z-index: 6; width: 220px;
    max-height: calc(100vh - 40px); overflow-y: auto; overscroll-behavior: contain;
  }
  #stylePanel h2 {
    margin: 0 0 2px; font-size: 11px; font-weight: 600; color: #888;
    letter-spacing: 0.05em; text-transform: uppercase;
  }
  #stylePanel h3 {
    margin: 4px 0 -4px; font-size: 10px; font-weight: 600; color: #666;
    letter-spacing: 0.05em; text-transform: uppercase;
  }
  #stylePanel hr {
    width: 100%; border: none; border-top: 1px solid #333; margin: 2px 0;
  }
  #stylePanel label {
    display: flex; flex-direction: column; gap: 4px;
  }
  #corpusSineControls {
    display: flex; flex-direction: column; gap: 10px;
  }
  #stylePanel .row {
    display: flex; justify-content: space-between; align-items: baseline;
  }
  #stylePanel .row span:last-child { color: #6cf; font-variant-numeric: tabular-nums; }
  #stylePanel select, #stylePanel input[type="range"] { width: 100%; }
  #stylePanel select {
    font: inherit; color: #ddd; background: #111; border: 1px solid #444;
    border-radius: 3px; padding: 3px 4px;
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <img id="frameOverlay" src="/images/frame.png" alt="" hidden>
  <div id="status"><span id="dot"></span></div>
  <div id="start"><button id="startBtn">Click to start listening</button></div>
  <div id="debug" hidden></div>

  <div id="stylePanel" hidden>
    <h2>Text style & timing (P to close)</h2>

    <h3>Typography</h3>
    <label>Font
      <select id="styleFont">
        <option value="'UnifrakturCook', serif">Blackletter</option>
        <option value="system-ui, sans-serif">System UI</option>
        <option value="Arial, Helvetica, sans-serif">Arial</option>
        <option value="Georgia, serif">Georgia</option>
        <option value="'Times New Roman', Times, serif">Times New Roman</option>
        <option value="'Courier New', Courier, monospace">Courier New</option>
        <option value="Verdana, sans-serif">Verdana</option>
        <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
      </select>
    </label>
    <label>
      <span class="row"><span>Weight</span><span id="styleWeightVal">700</span></span>
      <input type="range" id="styleWeight" min="100" max="900" step="100" value="700">
    </label>
    <label>
      <span class="row"><span>Size</span><span id="styleSizeVal">100%</span></span>
      <input type="range" id="styleSize" min="50" max="200" step="5" value="100">
    </label>
    <label>
      <span class="row"><span>User text max size</span><span id="styleUserSizeVal">100%</span></span>
      <input type="range" id="styleUserSize" min="80" max="250" step="5" value="100">
    </label>
    <label>
      <span class="row"><span>User size volume boost</span><span id="styleUserVolumeBoostVal">60%</span></span>
      <input type="range" id="styleUserVolumeBoost" min="0" max="200" step="5" value="60">
    </label>
    <label>
      <span class="row"><span>Letter spacing</span><span id="styleSpacingVal">0px</span></span>
      <input type="range" id="styleSpacing" min="-5" max="40" step="1" value="0">
    </label>

    <hr>

    <h3>Brightness (history log)</h3>
    <label>
      <span class="row"><span>Corpus text</span><span id="styleCorpusAlphaVal">100%</span></span>
      <input type="range" id="styleCorpusAlpha" min="0" max="100" step="5" value="100">
    </label>
    <label>
      <span class="row"><span>Spoken text</span><span id="styleUserAlphaVal">65%</span></span>
      <input type="range" id="styleUserAlpha" min="0" max="100" step="5" value="65">
    </label>

    <hr>

    <h3>Word size (history log)</h3>
    <label>
      <span class="row"><span>Spoken word size</span><span id="styleUserWordSizeVal">80%</span></span>
      <input type="range" id="styleUserWordSize" min="30" max="250" step="5" value="80">
    </label>
    <label>
      <span class="row"><span>Volume size boost</span><span id="styleVolumeBoostVal">200%</span></span>
      <input type="range" id="styleVolumeBoost" min="0" max="300" step="5" value="200">
    </label>

    <hr>

    <h3>Timing</h3>
    <label>
      <span class="row"><span>Transition (in/out)</span><span id="styleTransitionVal">0.3s</span></span>
      <input type="range" id="styleTransition" min="100" max="1200" step="50" value="300">
    </label>
    <label>
      <span class="row"><span>Display time</span><span id="styleHoldVal">1.2s</span></span>
      <input type="range" id="styleHold" min="300" max="6000" step="100" value="1200">
    </label>
    <label>Corpus pace mode
      <select id="styleCorpusMode">
        <option value="sine">Sine wave (varies over time)</option>
        <option value="linear">Linear (constant)</option>
      </select>
    </label>
    <label>
      <span class="row"><span>Corpus pace</span><span id="styleCorpusBaseVal">300ms/word</span></span>
      <input type="range" id="styleCorpusBase" min="20" max="1000" step="10" value="300">
    </label>
    <div id="corpusSineControls">
      <label>
        <span class="row"><span>Corpus pace amplitude</span><span id="styleCorpusAmplitudeVal">150ms</span></span>
        <input type="range" id="styleCorpusAmplitude" min="0" max="280" step="10" value="150">
      </label>
      <label>
        <span class="row"><span>Corpus pace frequency</span><span id="styleCorpusFrequencyVal">0.20Hz (5.0s)</span></span>
        <input type="range" id="styleCorpusFrequency" min="0.02" max="1" step="0.02" value="0.2">
      </label>
    </div>

    <hr>

    <h3>Video fill (history log)</h3>
    <label>Source
      <select id="styleVideoSource">
        <option value="camera">Camera</option>
      </select>
    </label>
    <label>Camera device
      <select id="styleCameraDevice">
        <option value="">Default</option>
      </select>
    </label>
    <label>
      <span class="row"><span>Influence</span><span id="styleVideoInfluenceVal">0%</span></span>
      <input type="range" id="styleVideoInfluence" min="0" max="100" step="5" value="0">
    </label>
    <label>
      <span class="row"><span>Gain</span><span id="styleVideoGainVal">1.0x</span></span>
      <input type="range" id="styleVideoGain" min="1" max="4" step="0.1" value="1">
    </label>

    <hr>

    <h3>MIDI (one note per word, out to IAC)</h3>
    <label>
      <span class="row"><span>Corpus velocity</span><span id="styleCorpusVelocityVal">90</span></span>
      <input type="range" id="styleCorpusVelocity" min="1" max="127" step="1" value="90">
    </label>
    <label>
      <span class="row"><span>Mic floor</span><span id="styleMicFloorVal">-50dB</span></span>
      <input type="range" id="styleMicFloor" min="-70" max="-20" step="1" value="-50">
    </label>
    <label>
      <span class="row"><span>Mic ceiling</span><span id="styleMicCeilVal">-12dB</span></span>
      <input type="range" id="styleMicCeil" min="-30" max="0" step="1" value="-12">
    </label>

    <hr>

    <h3>Proximity gate (SpeechBridge only)</h3>
    <span class="row"><span>Level</span><span id="gateReadout">not connected</span></span>
    <label>
      <span class="row"><span>Gate open</span><span id="styleGateOpenVal">-30dB</span></span>
      <input type="range" id="styleGateOpen" min="-90" max="0" step="1" value="-30">
    </label>
    <label>
      <span class="row"><span>Gate close</span><span id="styleGateCloseVal">-40dB</span></span>
      <input type="range" id="styleGateClose" min="-90" max="0" step="1" value="-40">
    </label>
    <label>
      <span class="row"><span>Utterance end (pause)</span><span id="styleUtteranceEndVal">0.80s</span></span>
      <input type="range" id="styleUtteranceEnd" min="400" max="3000" step="50" value="800">
    </label>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
